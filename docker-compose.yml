# Optional: run all three services on your own machine instead of Aiven (handy for offline practice).
#   docker compose up -d
# then use the "local" values at the bottom of .env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omnistore
    ports: ["5432:5432"]
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  kafka:
    image: apache/kafka:3.8.1       # single-node KRaft broker, advertises localhost:9092
    ports: ["9092:9092"]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
